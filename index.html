          "id": "u:19a17dee7aa4",
          "tpl": "<h3><strong>门诊费用报销便利</strong></h3>\n  <p>作为一级医院，我们全面支持医保报销，包括城镇职工医保和城乡居民医保，患者可享受大幅费用减免。同时，我们与商业保险公司合作，提供直赔服务，让您就医无后顾之忧，费用透明、经济实惠。</p>\n  <ol>\n    <li>报销比例高：通常情况下，一级医院的报销比例相对较高。以职工医保为例，在一些地区，一级医院住院费用的报销比例可能高达 80% - 90%甚至更高，而二级医院和三级医院的报销比例会逐级降低。</li>\n    <li>起付线低，一级医院的起付线一般低于二级和三级医院。这意味着患者在一级医院就医时，更容易达到起付线标准，从而开始享受医保报销。</li>\n    <li>费用相对较低，一级医院多为社区医院、乡镇卫生院等基层医疗机构，其医疗服务价格通常相对较低。再加上报销比例高，患者自付的费用会更少，经济负担相对较轻。</li>\n  </ol>\n  <h3><strong>停车方便，环境舒适</strong></h3>\n  <p>医院设有宽敞的停车场，患者及家属无需为停车发愁，就医更加从容。院内环境整洁优雅，候诊区宽敞舒适，处处体现人性化关怀</p>\n  <h3><strong>医护热心，服务一视同仁</strong></h3>\n  <p>我们的医护人员以热情和耐心著称，无论患者身份背景如何，都能感受到平等对待和真诚关怀。问诊细致、解释清晰，确保每位患者安心就医</p>\n  <h3><strong>人少快诊，流程便捷</strong></h3>\n  <p>相较于大型医院，崇仁中西医结合医院就诊人数相对较少，排队时间短，就医流程简化高效。患者从挂号到诊疗都能快速完成，无需长时间等待，真正做到“早诊早治”。</p>\n  <h3><strong>服务承诺，健康触手可及</strong></h3>\n  <p>在崇仁中西医结合医院，我们提供24小时急诊服务、预约挂号、健康咨询等一站式便捷服务。无论是骨科急症还是肠胃不适，我们都能迅速响应。医院还配备现代化病房和康复设施，确保住院患者得到全方位照护。\n    崇仁中西医结合医院，您身边的健康港湾。我们以专业的医疗技术、贴心的服务态度和便捷的就医体验，致力于守护每一位患者的健康。</p>\n",
